name: CI

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: .\tools\test-release-workspace.ps1
      - name: Generate third-party notices
        run: .\tools\write-third-party-notices.ps1 -Out target/THIRD-PARTY-NOTICES
      - name: Build release executable
        run: cargo build --release --locked -p claude-switch
      - uses: actions/upload-artifact@v7
        with:
          name: claude-switch-windows
          path: |
            target/release/claude-switch.exe
            target/THIRD-PARTY-NOTICES
          if-no-files-found: error
