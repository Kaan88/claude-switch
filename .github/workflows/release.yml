name: Release

'on':
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Find or install Inno Setup 7
        run: |
          $candidates = @(
            foreach ($base in ${env:ProgramFiles(x86)}, $env:ProgramFiles, "$env:LOCALAPPDATA\Programs") {
              if ($base) {
                Join-Path $base 'Inno Setup 7\ISCC.exe'
              }
            }
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $iscc) {
            $setup = Join-Path $env:RUNNER_TEMP 'innosetup-7.exe'
            Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $setup
            $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash
            if ($hash -ne '8A5A6711C3766A6E5FB74F280BA0E3551E719CE94538D901FDBD1F8F9920B3F0') { throw "Inno Setup download has an unexpected hash: $hash" }
            $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Inno Setup installation failed ($($p.ExitCode))." }
            $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'Could not locate ISCC.exe.' }
          "ISCC=$iscc" >> $env:GITHUB_ENV
      - name: Build and package
        run: .\tools\package.ps1 -AppVersion $env:GITHUB_REF_NAME.Substring(1) -Iscc $env:ISCC
      - name: Publish installer and bare executable
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/claude-switch-setup.exe
            target/release/claude-switch.exe
