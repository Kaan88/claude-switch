name: Release

'on':
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Find or install Inno Setup 7
        run: |
          $candidates = @(
            foreach ($base in ${env:ProgramFiles(x86)}, $env:ProgramFiles, "$env:LOCALAPPDATA\Programs") {
              if ($base) {
                Join-Path $base 'Inno Setup 7\ISCC.exe'
              }
            }
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $iscc) {
            $setup = Join-Path $env:RUNNER_TEMP 'innosetup-7.exe'
            Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $setup
            $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash
            if ($hash -ne '8A5A6711C3766A6E5FB74F280BA0E3551E719CE94538D901FDBD1F8F9920B3F0') { throw "Inno Setup download has an unexpected hash: $hash" }
            $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Inno Setup installation failed ($($p.ExitCode))." }
            $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'Could not locate ISCC.exe.' }
          "ISCC=$iscc" >> $env:GITHUB_ENV
      - name: Build and package
        run: .\tools\package.ps1 -AppVersion $env:GITHUB_REF_NAME.Substring(1) -Iscc $env:ISCC
      - name: Write hub.txt
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.Substring(1)
          $exe = 'target/release/claude-switch.exe'
          $fileVersion = (Get-Item -LiteralPath $exe).VersionInfo.FileVersion
          if ($fileVersion -cne $v) { throw "Tag version $v does not match the executable version '$fileVersion'." }

          $version = [regex]::Escape($v)
          $heading = "^##\s+(?:$version|\[$version\])(?:\s|$)"
          $inSection = $false
          $line = $null
          foreach ($text in Get-Content -LiteralPath CHANGELOG.md) {
            if ($inSection) {
              if ($text -match '^#{1,2}\s') { break }
              if ($text -match '^\s*-\s+(\S.*)$') { $line = $Matches[1]; break }
            } elseif ($text -cmatch $heading) {
              $inSection = $true
            }
          }
          if (-not $inSection) { throw "CHANGELOG.md has no section for $v." }
          if (-not $line) { throw "CHANGELOG.md has no notes bullet for $v." }

          $setup = 'claude-switch-setup.exe'
          $manifest = Join-Path $PWD 'dist/hub.txt'
          .\tools\write-hub-txt.ps1 -App claude-switch -Repo claude-switch -Version $v `
            -Notes $line -Kind setup -Exe claude-switch.exe `
            -Uninstall '{4F2C369B-84AF-4A46-AE8B-D22103025F78}_is1' `
            -Files @{ Name = $setup; Role = 'setup'; Path = "dist/$setup"; Silent = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART'; Scope = 'user' } `
            -Out $manifest
          Get-Content -LiteralPath $manifest
      - name: Publish installer, bare executable and Hub manifest
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/claude-switch-setup.exe
            target/release/claude-switch.exe
            dist/hub.txt
